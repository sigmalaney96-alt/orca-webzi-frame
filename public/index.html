<!DOCTYPE html>
<html>
    <head>
        <script src="/uv/uv.bundle.js"></script>
        <script src="/uv/uv.config.js"></script>

        <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/uv/sw.js", {
                    scope: __uv$config.prefix,
                });
            });
        }
        </script>

        <link rel="stylesheet" href="example.css">
    </head>
    <body>
        <!-- allow-scripts lets proxied pages run JS; allow-downloads is omitted so downloads never happen inside the frame -->
        <iframe id="iframeWindow" class="iframeWindow"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
    </body>
    <script src="example.js"></script>
</html>
